<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Construction -->
  <rect x="20" y="20" width="360" height="760" rx="45" fill="white" stroke="#2a2a2a" stroke-width="12"/>
  <rect x="35" y="35" width="330" height="730" rx="35" fill="#F3F4F6"/>
  
  <!-- Notch -->
  <path d="M120 35H280V65C280 73.2843 273.284 80 265 80H135C126.716 80 120 73.2843 120 65V35Z" fill="#1a1a1a"/>

  <!-- Content Container -->
  <g transform="translate(35, 90)">
    <!-- Header -->
    <text x="30" y="30" font-family="Arial" font-weight="bold" font-size="20" fill="#111827">Insights</text>
    
    <!-- Stats Row -->
    <g transform="translate(20, 60)">
       <rect width="140" height="100" rx="15" fill="white" filter="url(#shadow)"/>
       <circle cx="30" cy="30" r="15" fill="#E0E7FF"/>
       <text x="15" y="70" font-family="Arial" font-weight="bold" font-size="20" fill="#111827">53,090</text>
       <text x="15" y="85" font-family="Arial" font-size="10" fill="#6B7280">People reached</text>
       
       <rect x="150" width="140" height="100" rx="15" fill="white" filter="url(#shadow)"/>
       <circle cx="180" cy="30" r="15" fill="#FEF3C7"/>
       <text x="165" y="70" font-family="Arial" font-weight="bold" font-size="20" fill="#111827">2,478</text>
       <text x="165" y="85" font-family="Arial" font-size="10" fill="#6B7280">Engagement</text>
    </g>

    <!-- Post More Photos -->
    <g transform="translate(20, 180)">
       <rect width="290" height="80" rx="15" fill="#FAF5FF" stroke="#E9D5FF"/>
       <rect x="15" y="20" width="40" height="40" rx="8" fill="#A855F7" fill-opacity="0.2"/>
       <text x="70" y="35" font-family="Arial" font-weight="bold" font-size="14" fill="#111827">Post more photos</text>
       <text x="70" y="55" font-family="Arial" font-size="10" fill="#6B7280">Businesses with more photos get more clicks.</text>
    </g>

    <!-- Rating Section -->
    <rect x="20" y="280" width="290" height="250" rx="15" fill="white" filter="url(#shadow)"/>
    <text x="40" y="310" font-family="Arial" font-weight="bold" font-size="14" fill="#111827">How customers rate you</text>
    
    <g transform="translate(165, 360)">
       <text x="0" y="0" font-family="Arial" font-weight="bold" font-size="48" fill="#111827" text-anchor="middle">4.5</text>
       <g transform="translate(-40, 20)">
         <text x="0" y="0" fill="#F59E0B" font-size="20">★★★★½</text>
       </g>
       <text x="0" y="45" font-family="Arial" font-size="10" fill="#9CA3AF" text-anchor="middle">Based on 200 reviews</text>
    </g>

    <!-- Bars -->
    <g transform="translate(40, 440)">
       <text x="0" y="10" font-family="Arial" font-size="10" fill="#4B5563">Excellent</text>
       <rect x="50" y="2" width="180" height="8" rx="4" fill="#F3F4F6"/>
       <rect x="50" y="2" width="150" height="8" rx="4" fill="#2CB34A"/>
       <text x="240" y="10" font-family="Arial" font-size="10" fill="#4B5563">130</text>

       <text x="0" y="35" font-family="Arial" font-size="10" fill="#4B5563">Good</text>
       <rect x="50" y="27" width="180" height="8" rx="4" fill="#F3F4F6"/>
       <rect x="50" y="27" width="80" height="8" rx="4" fill="#84CC16"/>
       <text x="240" y="35" font-family="Arial" font-size="10" fill="#4B5563">45</text>

       <text x="0" y="60" font-family="Arial" font-size="10" fill="#4B5563">Average</text>
       <rect x="50" y="52" width="180" height="8" rx="4" fill="#F3F4F6"/>
       <rect x="50" y="52" width="20" height="8" rx="4" fill="#EAB308"/>
       <text x="240" y="60" font-family="Arial" font-size="10" fill="#4B5563">10</text>
    </g>

  </g>

  <!-- Floating Cards -->
  <g transform="translate(-50, 150)">
    <rect width="240" height="70" rx="12" fill="white" filter="url(#heavyShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#1877F2"/>
    <path d="M35 25V45M25 35H45" stroke="white" stroke-width="2"/>
    <text x="65" y="30" font-family="Arial" font-weight="bold" font-size="12" fill="#111827">Ad insight</text>
    <text x="65" y="48" font-family="Arial" font-size="10" fill="#4B5563">12 people just viewed your website.</text>
  </g>

  <g transform="translate(-50, 240)">
    <rect width="240" height="70" rx="12" fill="white" filter="url(#heavyShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#22C55E"/>
    <path d="M28 35L33 40L42 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="30" font-family="Arial" font-weight="bold" font-size="12" fill="#111827">Payment request</text>
    <text x="65" y="48" font-family="Arial" font-size="10" fill="#4B5563">Receiver 1000 from 08012345678.</text>
  </g>

   <g transform="translate(-50, 330)">
    <rect width="240" height="70" rx="12" fill="white" filter="url(#heavyShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#F59E0B"/>
    <path d="M35 26L37.5 31H43L39 35L40.5 40L35 37L29.5 40L31 35L27 31H32.5L35 26Z" fill="white"/>
    <text x="65" y="30" font-family="Arial" font-weight="bold" font-size="12" fill="#111827">Review</text>
    <text x="65" y="48" font-family="Arial" font-size="10" fill="#4B5563">Shola Herbert gave you 5 stars!</text>
  </g>

  <defs>
    <filter id="shadow" x="-4" y="-4" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <filter id="heavyShadow" x="-10" y="-10" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>
